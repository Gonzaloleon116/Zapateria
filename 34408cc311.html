<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SGCIC · Zapatería 3 Hermanos (Villahermosa)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6fb;--sf:#fff;--tx:#14213d;--mu:#5b6b8a;--bd:#d9e1ee;--bl:#0b4fb3;--bl2:#e6eefb;--or:#f47b20;--ok:#15803d;--okb:#e3f5e8;--wa:#b45309;--wab:#fff0d9;--er:#b91c1c;--erb:#fde7e7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1526;--sf:#16203a;--tx:#e8eefb;--mu:#98a7c6;--bd:#2a3858;--bl:#6ea2ff;--bl2:#1c2c52;--or:#ff9a4d;--ok:#5fd68a;--okb:#143324;--wa:#ffc277;--wab:#3a2a12;--er:#ff8f8f;--erb:#3d1b1b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1526;--sf:#16203a;--tx:#e8eefb;--mu:#98a7c6;--bd:#2a3858;--bl:#6ea2ff;--bl2:#1c2c52;--or:#ff9a4d;--ok:#5fd68a;--okb:#143324;--wa:#ffc277;--wab:#3a2a12;--er:#ff8f8f;--erb:#3d1b1b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{background:#0b3a85;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:19px;letter-spacing:.2px}header small{opacity:.8}
header .sp{flex:1}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--sf);border-bottom:1px solid var(--bd);padding:0 8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{border:0;background:none;color:var(--mu);padding:13px 14px;font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--bl);border-color:var(--or)}
main{max-width:1040px;margin:0 auto;padding:16px}
h2{margin:4px 0 12px;font-size:20px}h3{margin:0 0 8px;font-size:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;transition:outline .3s ease}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.btn{border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--bl);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.or{background:var(--or);color:#1b1000}.btn.gh{background:var(--bl2);color:var(--bl)}.btn.sm{padding:6px 10px;font-size:13px}
.btn.er{background:var(--erb);color:var(--er)}.btn.ok{background:var(--okb);color:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.t-Disponible,.t-Listo,.t-Entregado,.t-Activo{background:var(--okb);color:var(--ok)}
.t-Atendiendo,.t-Preparación{background:var(--bl2);color:var(--bl)}
.t-Descanso,.t-Inactivo{background:var(--wab);color:var(--wa)}
.t-Cancelado,.t-Agotado{background:var(--erb);color:var(--er)}
select,input{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);max-width:100%}
.alert{background:var(--erb);color:var(--er);border:2px solid var(--er);border-radius:12px;padding:12px;margin-bottom:14px;font-weight:700;animation:bl 1s infinite alternate}
@keyframes bl{to{opacity:.55}}@media (prefers-reduced-motion:reduce){.alert{animation:none}}
.ok{background:var(--okb);color:var(--ok);border-radius:12px;padding:10px;margin-bottom:14px;font-weight:600}
.mu{color:var(--mu);font-size:13px}.big{font-size:26px;font-weight:700}
.sizes{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.sz{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:5px 9px;cursor:pointer;font:inherit;font-size:13px}
.sz.on{background:var(--bl);color:#fff;border-color:var(--bl)}
.sz.out{border-color:var(--er);color:var(--er);background:var(--erb)}
.loc{background:var(--wab);color:var(--wa);border-radius:8px;padding:6px 8px;font-size:13px;font-weight:600}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
.bars{display:flex;gap:10px;align-items:flex-end;height:120px}.bars div{flex:1;background:var(--bl);border-radius:6px 6px 0 0;min-height:4px;position:relative}
.bars span{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:11px}
.lab{display:flex;gap:10px}.lab div{flex:1;text-align:center;font-size:12px;color:var(--mu)}
.pill{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--bd);cursor:pointer;background:var(--sf);color:var(--mu)}
.pill.on{background:var(--bl);color:#fff;border-color:var(--bl)}

.tag-seg-Hombre{background:var(--bl2);color:var(--bl)}
.tag-seg-Mujer{background:#fce7f3;color:#be185d}
.tag-seg-Niño,.tag-seg-Nino{background:var(--okb);color:var(--ok)}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]) .tag-seg-Mujer{background:#831843;color:#fce7f3}
}
:root[data-theme="dark"] .tag-seg-Mujer{background:#831843;color:#fce7f3}

.alt-box{background:var(--wab);border:1px solid var(--wa);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}

/* Modal estilizado */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.modal-box{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:14px;max-width:540px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 12px 32px rgba(0,0,0,0.3);padding:20px}
.ticket-paper{background:#fff;color:#111;font-family:"Courier New",Courier,monospace;padding:16px;border:1px dashed #aaa;border-radius:6px;font-size:13px;line-height:1.4}
.ticket-paper h4{margin:0 0 4px;text-align:center;font-size:16px}
.ticket-hr{border:0;border-top:1px dashed #999;margin:8px 0}

@media print {
 body * { visibility: hidden !important; }
 #modal-overlay, #modal-overlay * { visibility: visible !important; }
 #modal-overlay { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; background: #fff !important; color: #000 !important; padding: 0 !important; display: block !important; }
 .modal-box { border: 0 !important; box-shadow: none !important; max-width: 100% !important; padding: 0 !important; }
 .no-print { display: none !important; }
}
</style>
</head>
<body>
<header>
<div><b>SGCIC</b><br><small>Zapatería 3 Hermanos · Villahermosa, Tab.</small></div>
<div class="sp"></div>
<span id="who" class="mu" style="color:#fff"></span>
<label id="cfg1" class="mu" style="color:#fff">Temporada <select id="temp"><option>Regular</option><option>Alta</option></select></label>
<label id="cfg2" class="mu" style="color:#fff">Alerta espera <select id="umbral"><option value="180">3 min</option><option value="300">5 min</option><option value="15">15 s (demo)</option></select></label>
<button class="btn sm or" id="out" onclick="logout()">Cerrar sesión</button>
</header>
<nav id="nav"></nav>
<main id="app"></main>

<div id="modal-overlay"></div>

<script>
var TALLAS=[24,24.5,25,25.5,26,26.5,27,27.5,28];

function getInitialState(){
 var initialUsers=[
  {id:0,u:"admin",p:"admin123",rol:"admin",n:"Administrador",dni_rfc:"ADM-850101-HA1",correo:"admin@zapateria3h.mx",activo:true}
 ].concat([1,2,3,4,5].map(function(i){
  return {id:i,u:"vendedor"+i,p:"1234",rol:"vendedor",n:"Vendedor 0"+i,dni_rfc:"VEN-950"+i+"12-MX"+i,correo:"vendedor"+i+"@zapateria3h.mx",activo:true};
 }));

 var initialVend=[1,2,3,4,5].map(function(i){
  return {id:i,n:"Vendedor 0"+i,st:"Disponible",cli:null,pares:0,monto:0,com:0};
 });

 var initialProd=[
  ["001234","Tenis casual azul","Casual","Hombre",649,"Pasillo B · Estante 03 · Sección 2"],
  ["001235","Tenis deportivo blanco","Deportivo","Hombre",899,"Pasillo B · Estante 03 · Sección 2"],
  ["001236","Tenis negro running","Deportivo","Hombre",799,"Pasillo A · Estante 01 · Sección 1"],
  ["001237","Zapatilla rosa","Casual","Mujer",579,"Pasillo C · Estante 02 · Sección 4"],
  ["001240","Zapato formal café","Formal","Hombre",1099,"Pasillo D · Estante 05 · Sección 3"],
  ["001241","Bota vaquera","Bota","Hombre",1399,"Pasillo E · Estante 01 · Sección 2"],
  ["001242","Sandalia de piel","Sandalia","Mujer",499,"Pasillo C · Estante 04 · Sección 1"],
  ["001243","Tenis infantil luces","Deportivo","Niño",489,"Pasillo A · Estante 02 · Sección 3"],
  ["001244","Zapato escolar negro","Formal","Niño",549,"Pasillo A · Estante 03 · Sección 1"],
  ["001245","Tenis urbano blanco dama","Casual","Mujer",699,"Pasillo C · Estante 01 · Sección 2"]
 ].map(function(p,i){
  var st={};
  TALLAS.forEach(function(t,j){st[t]=(i*3+j*2)%5});
  return {sku:p[0],mod:p[1],cat:p[2],seg:p[3],pr:p[4],loc:p[5],st:st};
 });

 var initialProv=[
  {id:1,nombre:"Calzados del Sureste S.A. de C.V.",contacto:"Lic. Roberto Morales",telefono:"993 123 4567",correo:"ventas@calzadosureste.mx",categoria_calzado:"Casual y Escolar"},
  {id:2,nombre:"Distribuidora de Calzado Deportivo León",contacto:"Ing. Sofía Carrillo",telefono:"477 987 6543",correo:"contacto@deportivoleon.com",categoria_calzado:"Deportivo y Running"}
 ];

 return {
  tab:0,sel:{},cantSel:{},msg:"",
  users:initialUsers,vend:initialVend,order:[1,2,3,4,5],
  cola:[],cid:0,pedidos:[],pid:0,ventas:[],atendidos:[],
  prod:initialProd,proveedores:initialProv,provId:2,
  filterSeg:"Todos",filterFecIni:"",filterFecFin:"",
  q:"",qBod:"",filterSegBod:"Todos",
  act:null,user:null
 };
}

var S=getInitialState();
var $=function(i){return document.getElementById(i)};
function com(){return $("temp").value==="Alta"?25:15}
function money(n){return "$"+n.toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(s){return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2)}

function inferSegment(p){
 var m = ((p.mod||'') + ' ' + (p.cat||'')).toLowerCase();
 if(m.indexOf("zapatilla")>-1 || m.indexOf("sandalia")>-1 || m.indexOf("dama")>-1 || m.indexOf("mujer")>-1){
  return "Mujer";
 }
 if(m.indexOf("infantil")>-1 || m.indexOf("niño")>-1 || m.indexOf("nina")>-1 || m.indexOf("niña")>-1 || m.indexOf("escolar")>-1 || m.indexOf("luces")>-1){
  return "Niño";
 }
 return "Hombre";
}
function tagSeg(s){
 var seg = s || 'Hombre';
 var cls = 'tag-seg-' + (seg==='Niño'?'Niño':seg);
 return '<span class="tag '+cls+'">'+esc(seg)+'</span>';
}

function tag(s){return '<span class="tag t-'+String(s).replace("En preparación","Preparación")+'">'+s+'</span>'}
function vById(id){return S.vend.filter(function(v){return v.id===id})[0]}
function say(m){S.msg=m;render()}

/* 4 pestañas por rol */
function getTabs(){
 if(!S.user)return[];
 if(S.user.rol==="admin"){
  return ["Piso de ventas","Inventario","Bodega","Administración"];
 }
 return ["Piso de ventas","Inventario","Mis pedidos","Mis comisiones"];
}

/* Sincronización de Vendedores activos */
function syncVendedores(){
 var activeUsers=S.users.filter(function(u){return u.rol==="vendedor"&&u.activo});
 var activeIds=activeUsers.map(function(u){return u.id});
 activeUsers.forEach(function(u){
  var ex=vById(u.id);
  if(!ex){
   S.vend.push({id:u.id,n:u.n,st:"Disponible",cli:null,pares:0,monto:0,com:0});
  }else{
   ex.n=u.n;
  }
 });
 S.order=S.order.filter(function(id){return activeIds.indexOf(id)>=0});
 activeIds.forEach(function(id){
  if(S.order.indexOf(id)<0)S.order.push(id);
 });
}

function can(id){return S.user&&S.user.rol==="admin"||(S.user&&S.user.id===id)}

/* Comunicación con Backend Flask + MySQL */
function saveState(){}

async function api(method,url,body){
 try{
  var opts={method:method,headers:{"Content-Type":"application/json"}};
  if(body!==undefined)opts.body=JSON.stringify(body);
  var res=await fetch(url,opts);
  var data={};
  try{data=await res.json()}catch(e){}
  S.offline=false;
  if(!res.ok){
   return {ok:false,msg:data.msg||data.error||("Error del servidor ("+res.status+")"),status:res.status};
  }
  return data;
 }catch(e){
  S.offline=true;
  render();
  return {ok:false,msg:"Sin conexión con el servidor."};
 }
}

async function syncEstado(silent){
 try{
  var res=await fetch("/api/estado");
  if(!res.ok)throw new Error("HTTP "+res.status);
  var data=await res.json();
  S.offline=false;
  if(data.config){
   var ae=document.activeElement;
   if($("temp")&&ae!==$("temp"))$("temp").value=data.config.temp||"Regular";
   if($("umbral")&&ae!==$("umbral"))$("umbral").value=String(data.config.umbral||"180");
  }
  S.users=data.users||[];
  S.vend=data.vend||[];
  S.order=data.order||[];
  S.cola=data.cola||[];
  S.atendidos=data.atendidos||[];
  S.pedidos=data.pedidos||[];
  S.ventas=data.ventas||[];
  S.prod=data.prod||[];
  S.proveedores=data.proveedores||[];
  if(S.user){
   var me=S.users.filter(function(u){return u.id===S.user.id})[0];
   if(me){
    if(!me.activo){logout();return}
    S.user=me;
    try{sessionStorage.setItem("sgcic_user",JSON.stringify(me))}catch(e){}
   }
  }
  render();
 }catch(e){
  S.offline=true;
  if(!silent)say("No se pudo sincronizar con el servidor.");
  else render();
 }
}

/* Modales Reutilizables */
function closeModal(){
 var m=$("modal-overlay");
 m.style.display="none";
 m.innerHTML="";
}
function openConfirmModal(title,msg,onAccept,isDanger){
 var m=$("modal-overlay");
 m.style.display="flex";
 m.innerHTML='<div class="modal-box" style="max-width:440px"><h3 style="margin-top:0">'+esc(title)+'</h3><p>'+esc(msg)+'</p><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px"><button class="btn gh sm" onclick="closeModal()">Cancelar</button><button class="btn sm '+(isDanger?'er':'or')+'" id="modal-ok-btn">Aceptar</button></div></div>';
 $("modal-ok-btn").onclick=function(){closeModal();if(onAccept)onAccept()};
}

function reiniciarDemo(){
 openConfirmModal("Reiniciar datos demo","¿Estás seguro de que deseas restablecer todos los datos del sistema a los valores iniciales de fábrica?",async function(){
  var r=await api("POST","/api/demo/reset");
  if(!r.ok)return say(r.msg);
  S.tab=0;S.q="";S.filterSeg="Todos";S.act=null;
  await syncEstado();
  say(r.msg||"Sistema restablecido con datos demo iniciales.");
 },true);
}

/* Asignación automática de clientes (Tablet Piso) */
async function checkin(){
 var r=await api("POST","/api/checkin");
 await syncEstado();
 if(r.msg)say(r.msg);
}

async function asignar(){
 if(!S.cola.length)return say("No hay clientes en fila de espera.");
 var r=await api("POST","/api/asignar");
 await syncEstado();
 if(r.msg)say(r.msg);
}

async function setSt(id,st){
 var r=await api("POST","/api/vendedores/"+id+"/estado",{st:st});
 await syncEstado();
 if(r.msg)say(r.msg);
}

async function fin(id){
 if(S.act===id)S.act=null;
 var r=await api("POST","/api/vendedores/"+id+"/finalizar");
 await syncEstado();
 if(r.msg)say(r.msg);
}

/* Pedidos consolidados con apartado de stock */
async function pedir(sku){
 var a=S.act,t=S.sel[sku];
 var v=a?vById(a):null;
 if(!a||!v||!v.cli)return say("Primero ve a Piso de ventas: asigna un cliente o selecciona al vendedor que atiende.");
 if(!t)return say("Elige una talla antes de crear el pedido.");
 var cant=Math.max(1,parseInt(S.cantSel[sku],10)||1);
 var r=await api("POST","/api/pedidos",{vId:a,sku:sku,t:String(t),cant:cant});
 if(!r.ok)return say(r.msg);
 S.sel[sku]=null;S.cantSel[sku]=1;
 await syncEstado();
 if(r.msg)say(r.msg);
}

async function marcarItemListo(pedidoId,itemId){
 var r=await api("POST","/api/pedidos/"+pedidoId+"/items/"+itemId+"/listo");
 if(!r.ok&&r.msg)return say(r.msg);
 await syncEstado();
}

async function marcarPedidoTodoListo(pedidoId){
 var r=await api("POST","/api/pedidos/"+pedidoId+"/listo");
 if(!r.ok&&r.msg)return say(r.msg);
 await syncEstado();
}

async function ajustarCantItem(pedidoId,itemId,delta){
 var r=await api("PATCH","/api/pedidos/"+pedidoId+"/items/"+itemId,{delta:delta});
 if(!r.ok)return say(r.msg);
 await syncEstado();
 if(r.msg)say(r.msg);
}

async function quitarItemPedido(pedidoId,itemId){
 var r=await api("PATCH","/api/pedidos/"+pedidoId+"/items/"+itemId,{action:"quitar"});
 if(!r.ok)return say(r.msg);
 await syncEstado();
 if(r.msg)say(r.msg);
}

var _descTimer=null;
function actualizarDescPedido(pedidoId,val){
 var ped=S.pedidos.filter(function(x){return x.id===pedidoId})[0];
 if(!ped)return;
 var sub=ped.items.reduce(function(s,it){return s+(it.cant||1)*(it.pr||0)},0);
 var d=Math.max(0,parseFloat(val)||0);
 if(d>sub)d=sub;
 ped.desc=d;
 var totEl=$("tot_pagar_"+pedidoId);
 if(totEl)totEl.textContent=money(sub-d);
 clearTimeout(_descTimer);
 _descTimer=setTimeout(function(){
  api("PATCH","/api/pedidos/"+pedidoId+"/descuento",{desc:d});
 },400);
}

function cancelarPedido(id){
 openConfirmModal("Cancelar pedido #"+id,"¿Deseas devolver todos los pares de este pedido al inventario y cancelarlo?",async function(){
  var r=await api("POST","/api/pedidos/"+id+"/cancelar");
  if(!r.ok)return say(r.msg);
  await syncEstado();
  if(r.msg)say(r.msg);
 },true);
}

/* Venta unificada y emisión de ticket consolidado */
async function venderPedido(id){
 var p=S.pedidos.filter(function(x){return x.id===id})[0];
 var descInput=$("desc_"+id);
 var desc=descInput?Math.max(0,parseFloat(descInput.value)||0):(p?Math.max(0,parseFloat(p.desc)||0):0);
 var r=await api("POST","/api/pedidos/"+id+"/vender",{desc:desc});
 if(!r.ok)return say(r.msg);
 await syncEstado();
 if(r.msg)say(r.msg);
 if(r.folio)verTicket(r.folio);
}

function verTicket(folioOrVenta){
 var folio=typeof folioOrVenta==="string"?folioOrVenta:(folioOrVenta&&folioOrVenta.folio);
 if(!folio)return;
 var lineas=S.ventas.filter(function(x){return x.folio===folio});
 if(!lineas.length&&typeof folioOrVenta==="object"&&folioOrVenta){
  lineas=[folioOrVenta];
 }
 if(!lineas.length)return;
 var head=lineas[0];
 var subGen=lineas.reduce(function(a,x){return a+(x.subtotal||0)},0);
 var descGen=lineas.reduce(function(a,x){return a+(x.descuento||0)},0);
 var totGen=lineas.reduce(function(a,x){return a+(x.tot||0)},0);
 var paresGen=lineas.reduce(function(a,x){return a+(x.cant||1)},0);

 var itemsHtml=lineas.map(function(x){
  return '<div style="margin-bottom:6px">' +
   '<div><b>'+esc(x.mod)+'</b></div>' +
   '<div style="display:flex;justify-content:space-between;font-size:12px">' +
    '<span>SKU '+esc(x.sku)+' · T.'+x.t+' · '+x.cant+' x '+money(x.precioUnit)+'</span>' +
    '<span>'+money(x.subtotal)+'</span>' +
   '</div>' +
  '</div>';
 }).join("");

 var m=$("modal-overlay");
 m.style.display="flex";
 m.innerHTML=
  '<div class="modal-box" style="max-width:410px">' +
   '<div class="ticket-paper">' +
    '<h4>ZAPATERÍA 3 HERMANOS</h4>' +
    '<div style="text-align:center;font-size:11px">Av. Francisco I. Madero #649<br>Col. Centro, C.P. 86000<br>Villahermosa, Tabasco · RFC: ZTH-820412-TR1<br>Tel: (993) 314-5520</div>' +
    '<hr class="ticket-hr">' +
    '<div><b>FOLIO:</b> '+esc(head.folio)+'</div>' +

function aplicarEscaneo(){
 var val=($("scan_input").value||"").trim();
 if(!val)return;
 var p=S.prod.filter(function(x){return x.sku===val})[0];
 if(!p){alert("SKU no encontrado.");return}
 
 // NO filtramos con S.q, mantenemos el catálogo visible completo
 S.q="";
 S.filterSeg="Todos";
 var primerTalla=TALLAS.filter(function(t){return (p.st[t]||0)>0})[0]||TALLAS[0];
 S.sel[p.sku]=primerTalla;
 closeModal();
 render();
 
 // Desplazar suavemente hacia la tarjeta correspondiente

  var card=$("card_"+p.sku);

  }
 },50);

 '</div>';

 ["Todos","Hombre","Mujer","Niño"].forEach(function(sg){

  h+='</div>';
 }else{

function vMisPedidos(){

 });

 var h='<h2>Mis pedidos activos</h2>';
 if(!ps.length){
  h+='<div class="card"><p class="mu">No tienes pedidos pendientes en bodega. Cuando crees pedidos desde Inventario para tus clientes, aparecerán aquí con su ubicación física exacta para que monitorees su entrega y generes el ticket.</p></div>';
  return h;
 }

 h+='<div style="display:flex;flex-direction:column;gap:14px">';
 h+=ps.map(function(p){
  var items=p.items||[];
  var totalPares=items.reduce(function(a,it){return a+(it.cant||1)},0);

   var dur=Math.max(0,Math.round(((p.tListo||Date.now())-p.t0)/1000));
   tiempoInfo='<span class="tag t-Listo">Surtido en '+fmt(dur)+'</span>';
  }

  var itemsHtml=items.map(function(it){

     '<button class="btn sm gh" title="Restar 1 par" onclick="ajustarCantItem('+p.id+','+it.itemId+',-1)">-</button>' +
     '<b style="min-width:24px;text-align:center">'+c+'</b>' +
     '<button class="btn sm gh" title="Sumar 1 par" onclick="ajustarCantItem('+p.id+','+it.itemId+',1)">+</button>' +
     '<button class="btn sm er" onclick="quitarItemPedido('+p.id+','+it.itemId+')">Quitar</button>' +
    '</div>' +
   '</div>';
  }).join("");

  return '<div class="card">' +
   '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--bd)">' +

   '</div>' +
   '<div style="margin:6px 0">'+itemsHtml+'</div>' +
   '<div style="margin-top:10px;padding:10px;background:var(--bl2);border-radius:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">' +
    '<div>' +
     '<label style="font-size:13px">Descuento global ($): <input id="desc_'+p.id+'" type="number" value="'+desc+'" min="0" max="'+subtotal+'" step="10" style="width:90px;padding:4px" oninput="actualizarDescPedido('+p.id+',this.value)"></label>' +
     '<div class="mu" style="margin-top:4px">Total de pares: <b>'+totalPares+'</b> · Comisión total: <b>'+money(comTotal)+'</b></div>' +
    '</div>' +
    '<div style="text-align:right">' +

    (hayEnPrep?'<button class="btn sm" onclick="marcarPedidoTodoListo('+p.id+')">Marcar todo listo</button>':'') +

async function agregarStockBodega(sku){
 var tVal=String($("talla_add_"+sku).value);
 var cantVal=parseInt($("cant_add_"+sku).value,10);
 if(isNaN(cantVal)||cantVal<=0){
  alert("Ingresa una cantidad válida mayor a 0.");
  return;
 }
 var r=await api("POST","/api/inventario/agregar",{sku:sku,t:tVal,cant:cantVal});
 if(!r.ok)return say(r.msg);
 await syncEstado();
 if(r.msg)say(r.msg);
}

function agruparVentasPorFolio(lista){
 var map={},order=[];
 lista.forEach(function(v){
  if(!map[v.folio]){
   map[v.folio]={
    folio:v.folio,
    fechaISO:v.fechaISO,
    hora:v.hora,
    v:v.v,
    pares:0,
    tot:0,
    c:0,
    modelos:[]
   };
   order.push(map[v.folio]);
  }
  var g=map[v.folio];
  g.pares+=(v.cant||1);
  g.tot+=(v.tot||0);
  g.c+=(v.c||0);
  g.modelos.push(esc(v.mod)+' (T.'+v.t+' ×'+(v.cant||1)+')');
 });
 return order;
}

function exportarCSV(){
 var ini=S.filterFecIni,fin=S.filterFecFin;
 var vFiltradas=S.ventas.filter(function(v){
  if(ini&&v.fechaISO<ini)return false;
  if(fin&&v.fechaISO>fin)return false;
  return true;
 });
 
 var csv="\uFEFF";
 csv+="REPORTE DE VENTAS Y COMISIONES - ZAPATERÍA 3 HERMANOS\r\n";
 csv+="Sucursal: Villahermosa, Tabasco\r\n";
 csv+="Periodo: "+(ini||"Inicio")+" al "+(fin||"Hoy")+"\r\n";
 csv+="Generado el: "+new Date().toLocaleString("es-MX")+"\r\n\r\n";
 
 csv+="Folio,Fecha,Hora,Vendedor,SKU,Modelo,Categoria,Segmento,Talla,Cantidad,PrecioUnitario,Subtotal,Descuento,TotalPagado,Comision\r\n";
 vFiltradas.forEach(function(v){
  csv+=[
   '"'+v.folio+'"',
   v.fechaISO,
   v.hora,
   '"'+v.v+'"',
   '"'+v.sku+'"',
   '"'+v.mod+'"',
   '"'+v.cat+'"',
   '"'+(v.seg||'General')+'"',
   v.t,
   v.cant,
   v.precioUnit.toFixed(2),
   v.subtotal.toFixed(2),
   v.descuento.toFixed(2),
   v.tot.toFixed(2),
   v.c.toFixed(2)
  ].join(",")+"\r\n";
 });

 var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
 var url=URL.createObjectURL(blob);
 var a=document.createElement("a");
 a.href=url;
 a.download="Reporte_Ventas_SGCIC_"+new Date().toISOString().slice(0,10).replace(/-/g,"")+".csv";
 document.body.appendChild(a);
 a.click();
 document.body.removeChild(a);
 URL.revokeObjectURL(url);
 say("Reporte CSV generado y descargado exitosamente.");
}

/* 1. REINICIAR FILTROS EN LOGIN Y LOGOUT */
async function login(){
 var u=$("lu").value.trim().toLowerCase(),p=$("lp").value;
 var r=await api("POST","/api/login",{u:u,p:p});
 if(!r.ok){S.err=r.msg||"Usuario o contraseña incorrectos.";return render()}
 S.user=r.user;S.err="";S.msg="Bienvenido, "+r.user.n+".";
 S.tab=0;
 S.q="";
 S.filterSeg="Todos";
 try{sessionStorage.setItem("sgcic_user",JSON.stringify(r.user))}catch(e){}
 await syncEstado();
}

function logout(){
 S.user=null;
 S.act=null;
 S.msg="";
 S.q="";
 S.filterSeg="Todos";
 try{sessionStorage.removeItem("sgcic_user")}catch(e){}
 render();
}

function renderLogin(){
 $("nav").style.display="none";$("who").textContent="";$("cfg1").style.display=$("cfg2").style.display=$("out").style.display="none";
 $("app").innerHTML=(S.offline?'<div class="alert" role="alert" style="animation:none">⚠️ Sin conexión con el servidor. Verifica tu red o que el backend esté activo.</div>':"")+'<div class="card" style="max-width:380px;margin:30px auto"><h2>Iniciar sesión</h2>'+(S.err?'<div class="alert" role="alert" style="animation:none">'+S.err+'</div>':"")+'<p><label>Usuario<br><input id="lu" autocomplete="username" style="width:100%" onkeydown="if(event.key===\'Enter\')login()"></label></p><p><label>Contraseña<br><input id="lp" type="password" autocomplete="current-password" style="width:100%" onkeydown="if(event.key===\'Enter\')login()"></label></p><button class="btn or" style="width:100%" onclick="login()">Entrar</button><p class="mu">Cuentas de prueba:<br>Administrador: <b>admin</b> / <b>admin123</b><br>Vendedores: <b>vendedor1</b> a <b>vendedor5</b> / <b>1234</b></p></div>';
}

/* 1. REINICIAR FILTROS AL CAMBIAR DE PESTAÑA EN NAV */
function render(keep){
 if(!S.user){renderLogin();return}
 var avTabs=getTabs();
 if(S.tab>=avTabs.length)S.tab=0;
 $("nav").style.display="";$("out").style.display="";
 $("who").textContent=S.user.n+" ("+S.user.rol+")";
 $("cfg1").style.display=$("cfg2").style.display=S.user.rol==="admin"?"":"none";
 $("nav").innerHTML=avTabs.map(function(t,i){
  return '<button class="'+(S.tab===i?"on":"")+'" onclick="S.tab='+i+';S.q=\'\';S.filterSeg=\'Todos\';S.msg=\'\';render()">'+t+'</button>';
 }).join("");

 var f=document.activeElement&&document.activeElement.id==="q";
 var fBod=document.activeElement&&document.activeElement.id==="q_bod";
 var offlineBanner=S.offline?'<div class="alert" role="alert" style="animation:none">⚠️ Se perdió la conexión con el servidor. Intentando reconectar automáticamente…</div>':"";
 $("app").innerHTML=offlineBanner+(S.msg?'<div class="ok" role="status">'+esc(S.msg)+'</div>':"")+renderView();
 
 if(f){var e=$("q");if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}
 if(fBod){var eB=$("q_bod");if(eB){eB.focus();eB.setSelectionRange(eB.value.length,eB.value.length)}}
}

setInterval(function(){
 document.querySelectorAll("[data-t]").forEach(function(e){
  e.textContent=fmt(Math.max(0,Math.round((Date.now()-e.dataset.t)/1000)));
 });
 if(S.user&&S.tab===0){
  var u=+$("umbral").value,o=S.cola.some(function(c){return(Date.now()-c.t0)/1000>u}),h=!!document.querySelector(".alert:not([role='alert'])");
  if(o!==h)render();
 }
},1000);

/* Sincronización automática multi-equipo cada 4 segundos */
setInterval(function(){
 if(!S.user)return;
 var modalOpen=$("modal-overlay")&&$("modal-overlay").style.display==="flex";
 if(modalOpen)return;
 var ae=document.activeElement;
 if(ae&&(ae.tagName==="INPUT"||ae.tagName==="SELECT"||ae.tagName==="TEXTAREA"))return;
 syncEstado(true);
},4000);

$("temp").onchange=$("umbral").onchange=async function(){
 await api("POST","/api/config",{temp:$("temp").value,umbral:+$("umbral").value});
 await syncEstado();
};

(async function initApp(){
 try{
  var saved=sessionStorage.getItem("sgcic_user");
  if(saved)S.user=JSON.parse(saved);
 }catch(e){}
 if(S.user){
  await syncEstado(true);
 }else{
  render();
 }
})();
